    <link

    <!-- STYLE -->  
     <style>
        :root {
    --primary-ppl: #898AC4;
    --sec-ppl: #A2AADB;
    --thd-ppl: #C0C9EE;
    --bg-white: #FFF2E0;
    --bg-soft: #fff9f0;
    --text-dark: #332f44;
    --surface: rgba(255,255,255,0.95);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Comfortaa','Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #f7f3fb 0%, #fff9f0 100%);
    color: var(--text-dark);
}

nav {
    width: 100%;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(51, 43, 79, 0.09);
    position: sticky;
    top: 0;
    z-index: 20;
}

.navbar {
    max-width: 1200px;
    width: 100%;
    height: 80px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0;
    gap: 1rem;
}

.logo a {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    color: var(--primary-ppl);
    font-size: 1.35rem;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 0.08em;
}

.logo i {
    font-size: 1.45rem;
}

.link {
    display: flex;
    align-items: center;
    gap: 2rem;
    list-style: none;
}

.link li a {
    color: var(--text-dark);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
}

.link li a:hover,
.link li a:focus-visible {
    color: var(--primary-ppl);
}

.login,
.signup {
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.95rem 1.5rem;
    border-radius: 999px;
    font-weight: 600;
    transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
}

.login {
    color: var(--text-dark);
    background: rgba(137, 138, 196, 0.12);
    border: 1px solid transparent;
}

.signup {
    color: #fff;
    background: var(--primary-ppl);
}

.login:hover,
.signup:hover {
    transform: translateY(-1px);
}

.login:focus-visible,
.signup:focus-visible {
    outline: 2px solid var(--primary-ppl);
    outline-offset: 4px;
}

.nav-toggle-checkbox {
    display: none;
}

.nav-toggle {
    display: none;
    width: 42px;
    height: 34px;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
}

.nav-toggle span {
    display: block;
    position: absolute;
    left: 0;
    right: 0;
    height: 3px;
    background: #5b5672;
    border-radius: 999px;
    transition: transform 0.25s ease, opacity 0.25s ease;
}

.nav-toggle span:nth-child(1) {
    top: 6px;
}

.nav-toggle span:nth-child(2) {
    top: 15px;
}

.nav-toggle span:nth-child(3) {
    top: 24px;
}

.nav-toggle-checkbox:checked + .nav-toggle span:nth-child(1) {
    transform: translateY(9px) rotate(45deg);
}

.nav-toggle-checkbox:checked + .nav-toggle span:nth-child(2) {
    opacity: 0;
}

.nav-toggle-checkbox:checked + .nav-toggle span:nth-child(3) {
    transform: translateY(-9px) rotate(-45deg);
}

.nav-toggle-checkbox:checked ~ .link {
    max-height: 320px;
    opacity: 1;
    pointer-events: auto;
}

@media (max-width: 860px) {
    .navbar {
        min-height: 88px;
        padding: 0 20px;
    }

    .link {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        margin: 0;
        padding: 1.2rem 1.5rem 1.3rem;
        flex-direction: column;
        gap: 1rem;
        background: rgba(255,255,255,0.98);
        border-top: 1px solid rgba(137,138,196,0.15);
        box-shadow: 0 24px 40px rgba(57,47,93,0.09);
        transition: max-height 0.3s ease, opacity 0.3s ease;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        z-index: 15;
    }

    .link li a {
        width: 100%;
        padding: 0.9rem 1rem;
        border-radius: 16px;
    }

    .nav-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .signup,
    .login {
        width: 100%;
    }

    .login {
        background: transparent;
        border: 1px solid rgba(137,138,196,0.35);
    }

    .logo {
        flex: 1;
    }
}
     </style>

    <title>Scale</title>
  </head>

      <nav>
        <div class="navbar">
          <div class="logo">
            <a href="index.html"><i class="ph ph-pen-nib-straight"></i> SCALE</a>
          </div>

          <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox" aria-label="Toggle navigation">
          <label for="nav-toggle" class="nav-toggle" aria-label="Open navigation menu">
            <span></span>
            <span></span>
            <span></span>
          </label>

          <ul class="link">
            <li><a href="index.html">Home</a></li>
            <li><a href="design.html">Design</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>

          <div class="lgn-btn">
            <a href="#" class="login">Login</a>
            <a href="#" class="signup">Sign Up</a>
          </div>
        </div>
      </nav>
  </body>
