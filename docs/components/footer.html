     <style>
        :root {
    --primary-ppl: #898AC4;
    --sec-ppl: #A2AADB;
    --thd-ppl: #C0C9EE;
    --bg-white: #FFF2E0;
    --bg-soft: #fff9f0;
    --text-dark: #332f44;
    --surface: rgba(255,255,255,0.95);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Comfortaa','Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #f7f3fb 0%, #fff9f0 100%);
    color: var(--text-dark);
}

/* Footer */
.site-footer {
    padding: 48px 32px;
    background: rgba(255, 255, 255, 0.98);
    border-top: 1px solid rgba(137, 138, 196, 0.18);
    color: rgba(51, 47, 75, 0.9);
}

.footer-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 2rem;
    align-items: flex-start;
}

.footer-brand a {
    display: inline-flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary-ppl);
    text-decoration: none;
}

.footer-brand i {
    font-size: 1.4rem;
}

.footer-links strong,
.footer-contact strong {
    display: block;
    margin-bottom: 1rem;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dark);
}

.footer-links ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.75rem;
}

.footer-links li a {
    color: var(--text-dark);
    text-decoration: none;
    transition: color 0.2s ease;
}

.footer-links li a:hover {
    color: var(--primary-ppl);
}

.footer-contact p {
    margin: 0 0 0.85rem;
    line-height: 1.7;
    color: rgba(51, 47, 75, 0.82);
}

@media (max-width: 860px) {
    .footer-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }

    .site-footer {
        padding: 36px 20px;
    }
}

     </style>
